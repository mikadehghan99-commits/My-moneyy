<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>My Money</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Tahoma;color:#111827}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 16px 90px;background:#f8fafc}h1{margin:0;font-size:28px}.sub{color:#6b7280;font-size:13px;margin:4px 0 18px}.card{background:#111827;color:white;border-radius:24px;padding:22px}.label{font-size:13px;opacity:.7}.balance{font-size:30px;font-weight:800;margin:7px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff12;border-radius:16px;padding:12px;font-size:12px}.stat b{display:block;font-size:16px;margin-top:5px}.green{color:#86efac}.red{color:#fca5a5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.btn{border:0;border-radius:17px;padding:15px;font-size:15px;font-weight:700}.in{background:#dcfce7;color:#166534}.out{background:#fee2e2;color:#991b1b}.section{font-weight:800;font-size:17px;margin:22px 2px 10px}.list{background:white;border-radius:20px;overflow:hidden}.empty{text-align:center;color:#9ca3af;padding:28px}.row{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid #f1f5f9}.name{font-weight:700}.meta{font-size:12px;color:#9ca3af;margin-top:4px}.amount{font-weight:800}.plus{color:#15803d}.minus{color:#b91c1c}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#fffffff2;border-top:1px solid #e5e7eb;padding:10px}nav button{border:0;background:none;color:#6b7280;font-size:12px}.active{color:#111827;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(520px,100%);margin:auto;background:white;border-radius:28px 28px 0 0;padding:22px}.field{width:100%;padding:14px;border:1px solid #e5e7eb;border-radius:14px;margin:0 0 10px;font-size:16px}.save{width:100%;background:#111827;color:white}.cancel{width:100%;background:#f3f4f6;margin-top:8px}</style><body><div class="app"><h1>My Money 💰</h1><div class="sub" id="month"></div><div class="card"><div class="label">موجودی کل</div><div class="balance" id="balance">۰ تومان</div><div class="stats"><div class="stat">درآمد<b class="green" id="income">۰</b></div><div class="stat">هزینه<b class="red" id="expense">۰</b></div></div></div><div class="actions"><button class="btn in" onclick="openM('income')">＋ ثبت درآمد</button><button class="btn out" onclick="openM('expense')">－ ثبت هزینه</button></div><div class="section">آخرین تراکنش‌ها</div><div class="list" id="list"><div class="empty">هنوز تراکنشی ثبت نشده</div></div></div><nav><button class="active">🏠<br>خانه</button><button>💳<br>حساب‌ها</button><button>📊<br>گزارش</button><button>⚙️<br>تنظیمات</button></nav><div class="modal" id="modal"><div class="sheet"><h2 id="mtitle">ثبت هزینه</h2><input class="field" id="amount" type="number" inputmode="decimal" placeholder="مبلغ به تومان"><input class="field" id="desc" placeholder="عنوان"><input class="field" id="cat" placeholder="دسته‌بندی"><button class="btn save" onclick="saveT()">ذخیره</button><button class="btn cancel" onclick="modal.classList.remove('show')">انصراف</button></div></div><script>let d=JSON.parse(localStorage.getItem('mymoney')||'[]'),t='expense';const fa=n=>Number(n).toLocaleString('fa-IR');function render(){let i=0,e=0;d.forEach(x=>x.type==='income'?i+=x.amount:e+=x.amount);balance.textContent=fa(i-e)+' تومان';income.textContent=fa(i)+' تومان';expense.textContent=fa(e)+' تومان';month.textContent=new Date().toLocaleDateString('fa-IR',{year:'numeric',month:'long'});list.innerHTML=d.length?d.slice().reverse().slice(0,30).map(x=>`<div class="row"><div><div class="name">${safe(x.desc)}</div><div class="meta">${safe(x.cat)} • ${new Date(x.date).toLocaleDateString('fa-IR')}</div></div><div class="amount ${x.type==='income'?'plus':'minus'}">${x.type==='income'?'+':'-'} ${fa(x.amount)}</div></div>`).join(''):'<div class="empty">هنوز تراکنشی ثبت نشده</div>'}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function openM(x){t=x;mtitle.textContent=x==='income'?'ثبت درآمد':'ثبت هزینه';amount.value='';desc.value='';cat.value='';modal.classList.add('show')}function saveT(){let a=Number(amount.value);if(!a)return alert('مبلغ را وارد کن');d.push({type:t,amount:a,desc:desc.value||'بدون عنوان',cat:cat.value||'عمومی',date:new Date().toISOString()});localStorage.setItem('mymoney',JSON.stringify(d));modal.classList.remove('show');render()}render();</script></body></html>
